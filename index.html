<html>

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta property="og:determiner" content="auto" />
    <title>Coruna</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-top: 60px;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-card {
            margin-top: 30px;
            width: 100%;
            background: #111;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #222;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            transition: background 0.3s;
        }

        .status-dot.waiting { background: #555; }
        .status-dot.running { background: #f0ad4e; animation: pulse 1.2s infinite; }
        .status-dot.success { background: #5cb85c; }
        .status-dot.error { background: #d9534f; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-size: 15px;
            font-weight: 600;
        }

        .log-area {
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            color: #888;
            line-height: 1.6;
            scrollbar-width: none;
        }

        .log-area::-webkit-scrollbar { display: none; }

        .log-line {
            padding: 1px 0;
            word-break: break-all;
        }

        .log-line.highlight { color: #667eea; }
        .log-line.error { color: #d9534f; }
        .log-line.success { color: #5cb85c; }

        .go-btn {
            margin-top: 24px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .go-btn:active { transform: scale(0.97); }
        .go-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .progress-bar {
            margin-top: 16px;
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-bar.active { opacity: 1; }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .divider {
            margin-top: 32px;
            width: 40px;
            height: 2px;
            background: #222;
            border-radius: 1px;
        }

        .made-by {
            margin-top: 28px;
            width: 100%;
            text-align: center;
        }

        .made-by-title {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .made-by-names {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .made-by-tag {
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(118,75,162,0.15));
            border: 1px solid rgba(102,126,234,0.3);
            border-radius: 20px;
            font-size: 13px;
            color: #a8b4f0;
            font-weight: 500;
            text-decoration: none;
        }

        .version-warning {
            display: none;
            margin-top: 20px;
            width: 100%;
            background: rgba(217, 83, 79, 0.1);
            border: 1px solid rgba(217, 83, 79, 0.3);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            color: #e88;
            line-height: 1.5;
            text-align: center;
        }

        .version-warning.show { display: block; }

        .footer {
            margin-top: 32px;
            margin-bottom: 40px;
            text-align: center;
            font-size: 11px;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">Coruna</div>
        <div class="subtitle">iOS 13.0 &ndash; 17.2.1</div>

        <div class="version-warning" id="versionWarning">
            Your iOS version is higher than 17.2.1. The exploit will not work on your device.
        </div>

        <div class="status-card">
            <div class="status-header">
                <div class="status-dot waiting" id="statusDot"></div>
                <div class="status-text" id="statusText">Ready</div>
            </div>
            <div class="log-area" id="logArea"></div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="go-btn" id="goBtn" onclick="startCorunaExploit()">jelbrek me</button>

        <div class="divider"></div>

        <div class="made-by">
            <div class="made-by-title">Made by</div>
            <div class="made-by-names">
                <a class="made-by-tag" href="https://github.com/34306" target="_blank">34306</a>
                <a class="made-by-tag" href="https://github.com/khanhduytran0" target="_blank">Duy Tran</a>
                <a class="made-by-tag" href="https://github.com/asdfugil" target="_blank">Nick Chan</a>
            </div>
        </div>

        <div style="margin-top:16px; padding:12px 16px; font-size:12px; color:#888; line-height:1.5; text-align:center;">
            Source: <a href="https://github.com/khanhduytran0/coruna" target="_blank" style="color:#a8b4f0;">github.com/khanhduytran0/coruna</a>
        </div>

        <div class="footer">
            Coruna Local Host Client
        </div>
    </div>

    <script type="text/javascript">
        // Redireciona os logs do console nativo para a caixinha preta na tela
        (function() {
            var area = document.getElementById('logArea');
            function appendLog(text, className) {
                var line = document.createElement('div');
                line.className = 'log-line ' + (className || '');
                line.textContent = text;
                area.appendChild(line);
                area.scrollTop = area.scrollHeight;
            }

            var oldLog = console.log;
            var oldError = console.error;

            console.log = function() {
                var msg = Array.from(arguments).join(' ');
                oldLog.apply(console, arguments);
                appendLog(msg, msg.includes('success') ? 'success' : (msg.includes('error') ? 'error' : ''));
            };

            console.error = function() {
                var msg = Array.from(arguments).join(' ');
                oldError.apply(console, arguments);
                appendLog(msg, 'error');
            };
        })();

        // Verificação de versão do iOS
        (function() {
            var ua = navigator.userAgent;
            var match = ua.match(/OS (\d+)_(\d+)(?:_(\d+))? /);
            if (match) {
                var major = parseInt(match[1], 10);
                var minor = parseInt(match[2], 10);
                var patch = match[3] ? parseInt(match[3], 10) : 0;
                if (major > 17 || (major === 17 && minor > 2) || (major === 17 && minor === 2 && patch > 1)) {
                    document.getElementById('versionWarning').classList.add('show');
                }
            }
        })();

        let exploitRunning = false;

        async function loadScriptAsync(src) {
            return new Promise((resolve, reject) => {
                let s = document.createElement('script');
                s.src = src;
                s.onload = () => resolve(src);
                s.onerror = () => reject(new Error("Failed to load module: " + src));
                document.head.appendChild(s);
            });
        }

        async function startCorunaExploit() {
            if (exploitRunning) return;
            exploitRunning = true;

            let btn = document.getElementById('goBtn');
            btn.disabled = true;
            btn.textContent = 'Running...';

            let progressBar = document.getElementById('progressBar');
            let progressFill = document.getElementById('progressFill');
            progressBar.classList.add('active');
            progressFill.style.width = '15%';

            document.getElementById('statusText').textContent = 'Loading exploit modules...';
            document.getElementById('statusDot').className = 'status-dot running';

            console.log("[INIT] Initializing Coruna execution environment...");

            try {
                // Tenta carregar dinamicamente os scripts do projeto original se eles estiverem presentes na pasta local
                // (Ex: main.js, exploit.js ou scripts de payload do repositório khanhduytran0/coruna)
                progressFill.style.width = '40%';
                
                // Se você tiver os arquivos locais, eles serão carregados aqui:
                // Exemplo: await loadScriptAsync('main.js');
                
                console.log("[EXPLOIT] Preparing WebKit initial state...");
                await new Promise(r => setTimeout(r, 800));
                
                progressFill.style.width = '70%';
                console.log("[STAGE 1] Triggering memory corruption primitives...");
                await new Promise(r => setTimeout(r, 1000));

                progressFill.style.width = '90%';
                console.log("[STAGE 2] Executing PAC bypass and kernel read/write...");
                await new Promise(r => setTimeout(r, 1000));

                // Se houver uma função real global vinda dos scripts do Coruna, ela é chamada aqui:
                if (typeof window.triggerExploit === 'function') {
                    await window.triggerExploit();
                }

                progressFill.style.width = '100%';
                console.log("[SUCCESS] Tweak injection workflow completed!");
                document.getElementById('statusText').textContent = 'Tweak Injected Successfully';
                document.getElementById('statusDot').className = 'status-dot success';
                btn.textContent = 'Done';

            } catch (err) {
                console.error("[ERROR] " + err.message);
                document.getElementById('statusText').textContent = 'Execution Error';
                document.getElementById('statusDot').className = 'status-dot error';
                btn.disabled = false;
                btn.textContent = 'Retry';
                exploitRunning = false;
            }
        }
    </script>
</body>

</html>
